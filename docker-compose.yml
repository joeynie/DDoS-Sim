version: '3.8'

services:
  # # C&C控制服务器
  # c2_server:
  #   build: ./c2_server
  #   hostname: c2
  #   container_name: c2_server
  #   ports:
  #     - "5000:5000"  # Web控制面板
  #   networks:
  #     attack_net:
  #       ipv4_address: 10.10.10.2

  # # 僵尸网络节点 - 使用 scale 动态扩展
  # bot:
  #   build: ./bot
  #   cap_add:
  #     - NET_ADMIN
  #   environment:
  #     - C2_SERVER=http://10.10.10.2:5000
  #   depends_on:
  #     - c2_server
  #   networks:
  #     - attack_net
  #   deploy:
  #     replicas: 5  # 定义bot数量，可随时修改

  # 原有的attacker容器（保留用于单点攻击测试）
  attacker:
    build: ./attacker
    hostname: attacker
    container_name: attacker
    cap_add:
      - NET_ADMIN
    networks:
      attack_net:
        ipv4_address: 10.10.10.10

  # 正常用户模拟器
  user:
    build: ./user
    hostname: user
    container_name: user
    cap_add:
      - NET_ADMIN
    networks:
      attack_net:
        ipv4_address: 10.10.10.20

  victim:
    build: ./victim
    hostname: victim
    container_name: victim
    # 将nginx的80端口映射到主机的8888端口，方便我们观察
    ports:
      - "8888:80"
    privileged: true
    networks:
      victim_net:
        ipv4_address: 10.10.20.20
    deploy:
      resources:
        limits:
          memory: "64M"     # 限制内存
          cpus: "0.2"       # 限制CPU

  # victim_flask:
  #   build: ./victim_flask
  #   hostname: victim_flask
  #   container_name: victim_flask
  #   ports:
  #     - "9998:80"  # 映射到主机的 9999 端口
  #   cap_add:
  #     - NET_ADMIN  # 需要权限添加静态路由
  #   networks:
  #     victim_net:
  #       ipv4_address: 10.10.20.30 # 分配同一个网段的不同IP

  defender:
    build: ./defender
    hostname: defender
    container_name: defender
    # 启用特权模式，否则无法修改内核网络参数和iptables/nftables
    privileged: true
    # 暴露防御API端口
    ports:
      - "5001:5000"  # 防御系统API
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      attack_net:
        ipv4_address: 10.10.10.5
      victim_net:
        ipv4_address: 10.10.20.5

networks:
  attack_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
  victim_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24