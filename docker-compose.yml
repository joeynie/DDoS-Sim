version: '3.8'

services:
  # C&C控制服务器
  c2_server:
    build: ./c2_server
    hostname: c2
    container_name: c2_server
    ports:
      - "5000:5000"  # Web控制面板
    networks:
      attack_net:
        ipv4_address: 10.10.10.2

  # 僵尸网络节点 (5个bot)
  bot1:
    build: ./bot
    hostname: bot1
    container_name: bot1
    cap_add:
      - NET_ADMIN
    environment:
      - BOT_ID=bot_001
      - C2_SERVER=http://10.10.10.2:5000
    depends_on:
      - c2_server
    networks:
      attack_net:
        ipv4_address: 10.10.10.11

  bot2:
    build: ./bot
    hostname: bot2
    container_name: bot2
    cap_add:
      - NET_ADMIN
    environment:
      - BOT_ID=bot_002
      - C2_SERVER=http://10.10.10.2:5000
    depends_on:
      - c2_server
    networks:
      attack_net:
        ipv4_address: 10.10.10.12

  bot3:
    build: ./bot
    hostname: bot3
    container_name: bot3
    cap_add:
      - NET_ADMIN
    environment:
      - BOT_ID=bot_003
      - C2_SERVER=http://10.10.10.2:5000
    depends_on:
      - c2_server
    networks:
      attack_net:
        ipv4_address: 10.10.10.13

  bot4:
    build: ./bot
    hostname: bot4
    container_name: bot4
    cap_add:
      - NET_ADMIN
    environment:
      - BOT_ID=bot_004
      - C2_SERVER=http://10.10.10.2:5000
    depends_on:
      - c2_server
    networks:
      attack_net:
        ipv4_address: 10.10.10.14

  bot5:
    build: ./bot
    hostname: bot5
    container_name: bot5
    cap_add:
      - NET_ADMIN
    environment:
      - BOT_ID=bot_005
      - C2_SERVER=http://10.10.10.2:5000
    depends_on:
      - c2_server
    networks:
      attack_net:
        ipv4_address: 10.10.10.15

  # 原有的attacker容器（保留用于单点攻击测试）
  attacker:
    build: ./attacker
    hostname: attacker
    container_name: attacker
    cap_add:
      - NET_ADMIN
    networks:
      attack_net:
        ipv4_address: 10.10.10.10

  # 正常用户模拟器
  user:
    build: ./user
    hostname: user
    container_name: user
    cap_add:
      - NET_ADMIN
    networks:
      attack_net:
        ipv4_address: 10.10.10.20

  victim:
    build: ./victim
    hostname: victim
    container_name: victim
    # 将nginx的80端口映射到主机的8888端口，方便我们观察
    ports:
      - "8888:80"
    privileged: true
    networks:
      victim_net:
        ipv4_address: 10.10.20.20

  defender:
    build: ./defender
    hostname: defender
    container_name: defender
    # 启用特权模式，否则无法修改内核网络参数和iptables/nftables
    privileged: true
    # 暴露防御API端口
    ports:
      - "5001:5000"  # 防御系统API
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      attack_net:
        ipv4_address: 10.10.10.5
      victim_net:
        ipv4_address: 10.10.20.5

networks:
  attack_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
  victim_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24